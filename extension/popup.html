ion: fixed; inset: 0; z-index: 3; border-radius: var(--rad); padding: 1.5px; overflow: hidden; pointer-events: none; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); } .edge i { position: absolute; left: 50%; top: 50%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax; opacity: 0; background: conic-gradient(from 0deg, transparent 0deg, transparent 236deg, rgba(255, 255, 255, 0.95) 330deg, transparent 360deg); } body.in .edge i { animation: sweep 1.7s cubic-bezier(0.4, 0, 0.2, 1) 0.18s both; } @keyframes sweep { 0% { opacity: 0; transform: rotate(0deg); } 10% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; transform: rotate(360deg); } } .rise { opacity: 0; } body.in .rise { animation: rise 0.85s cubic-bezier(0.16, 1, 0.3, 1) calc(0.1s + var(--i) * 0.07s) both; } @keyframes rise { from { opacity: 0; transform: translate3d(0, 12px, 0); } to { opacity: 1; transform: none; } } header { display: flex; align-items: center; gap: 12px; } .app { display: block; width: 30px; height: 30px; border-radius: 8px; } .head { flex: 1; min-width: 0; } .title { font-size: 14px; font-weight: 700; letter-spacing: 0.005em; line-height: 1.2; color: #f5f5f7; } .sub { margin-top: 2px; font-size: 12px; line-height: 1.2; color: #8e8e93; } .close { position: relative; width: 32px; height: 32px; margin-right: -4px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #8e8e93; cursor: pointer; pointer-events: none; transition: background 0.2s cubic-bezier(0.2, 0, 0, 1), color 0.2s cubic-bezier(0.2, 0, 0, 1); } html.mode-window .close { pointer-events: auto; } .close.hot, .close:hover, .close:focus-visible { background: rgba(255, 255, 255, 0.08); color: #fff; } .close:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.85); outline-offset: 1px; } .close .x { width: 14px; height: 14px; fill: e-between; align-items: baseline; font-size: 12px; color: #8e8e93; } .rail .r1 b { color: #fff; font-size: 14px; font-variant-numeric: tabular-nums; } .rbar { position: relative; height: 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.09); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6); } .rbar i { position: absolute; inset: 0; border-radius: 6px; transform-origin: 0 50%; background: linear-gradient(90deg, #7a3e00, #ff9f0a 75%, #ffd68a); box-shadow: 0 0 14px rgba(255, 159, 10, 0.55); transform: scaleX(var(--p, 0)); } body.in .rbar i { animation: grow 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; } @keyframes grow { from { transform: scaleX(0); } } .rbar::after { content: ""; position: absolute; top: 50%; left: calc(var(--p, 0) * 100%); width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255, 159, 10, 0.4), 0 0 14px 3px rgba(255, 159, 10, 0.8); } .rmsg { font-size: 13px; color: #ffc46b; line-height: 1.3; }</style>

<body>
  <div class="edge" aria-hidden="true"><i></i></div>

  <main id="card" role="status" aria-live="polite">
    <header class="rise" style="--i:0">
      <img class="app" src="icons/icon48.png" alt="" width="30" height="30" draggable="false">
      <div class="head">
        <p class="title">NEET UG 2028</p>
        <p class="sub">Reminder</p>
      </div>
      <button id="close" class="close" type="button" aria-label="Dismiss reminder">
        <svg class="ring" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="track" cx="16" cy="16" r="13"/>
          <circle class="prog" id="ring" cx="16" cy="16" r="13"/>
        </svg>
        <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8M16 8l-8 8"/></svg>
      </button>
    </header>

    <div class="row">
      <div class="pair">
        <div class="cell"><div id="months"></div><span class="lab rise" style="--i:3">months</span></div>
        <div class="cell"><div id="days"></div><span class="lab rise" style="--i:4">days</span></div>
      </div>
      <div class="total rise" style="--i:2">
        <p class="num" id="total"></p>
        <p class="lbl" id="lbl">days to go</p>
        <p class="date" id="date"></p>
      </div>
    </div>

    <div class="rail rise" style="--i:5">
      <div class="r1"><span><b id="r-day"></b></span><span id="r-pct"></span></div>
      <div class="rbar" id="rbar"><i></i></div>
      <p class="rmsg" id="rmsg"></p>
    </div>
  </main>
</body>
