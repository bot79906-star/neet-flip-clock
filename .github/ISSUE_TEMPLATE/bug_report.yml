name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a new tab\n2. Press D\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "4.4.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Brave, Other Chromium]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 14, Ubuntu 24.04"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: "Never paste your GitHub sync token."
